<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <!-- 引入所有圖片的特徵檔 targets.mind (裡面包含你的 10 張圖特徵) -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: true">
      
      <a-assets>
        <!-- 預先載入你的多媒體檔案 -->
        <a-asset-item id="myModel" src="Office_Chair.usdz"></a-asset-item>
        <video id="myVideo" src="NiuNiuVideo.mp4" loop crossorigin="anonymous"></video>
        <audio id="myAudio" src="Joy Ride.mp3" preload="auto"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- ================= 辨識圖 0：呈現 3D 模型 ================= -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model src="#myModel" position="0 0 0" scale="0.5 0.5 0.5"></a-gltf-model>
      </a-entity>

      <!-- ================= 辨識圖 1：呈現影片 ================= -->
      <!-- 透過事件監聽：當圖片被辨識到就播放影片，移開就暫停 -->
      <a-entity mindar-image-target="targetIndex: 1" 
                on="targetFound: document.querySelector('#myVideo').play();" 
                off="targetLost: document.querySelector('#myVideo').pause();">
        <a-video src="#myVideo" position="0 0 0" width="1" height="0.56" rotation="0 0 0"></a-video>
      </a-entity>

      <!-- ================= 辨識圖 2：播放 MP3 聲音 ================= -->
      <a-entity mindar-image-target="targetIndex: 2"
                on="targetFound: document.querySelector('#myAudio').play();"
                on-lost="targetLost: document.querySelector('#myAudio').pause();">
        <!-- 這裡放一個簡單的 2D 提示標籤或圖示，提示使用者正在播放聲音 -->
        <a-plane color="black" opacity="0.6" width="1" height="0.3">
          <a-text value="Playing Audio..." align="center" color="white" scale="0.5 0.5 0.5"></a-text>
        </a-plane>
      </a-entity>

      <!-- 依此類推，你可以一直往下寫到 targetIndex: 9 (共10張圖) -->

    </a-scene>
  </body>
</html>
