<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      #ar-button {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 99999;
        background: #007aff;
        color: white;
        padding: 14px 28px;
        border: none;
        border-radius: 25px;
        font-size: 18px;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      }
      /* 強制浮動在最上層的即時座標面板 */
      #info-panel {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 99999;
        background: rgba(0, 0, 0, 0.85);
        color: #00ffcc;
        padding: 12px 16px;
        border-radius: 8px;
        font-family: monospace;
        font-size: 16px;
        border: 2px solid #00ffcc;
        pointer-events: none;
      }
    </style>
    
    <!-- 專為手指拖曳平移設計的元件 -->
    <script>
      AFRAME.registerComponent('touch-drag-move', {
        init: function () {
          this.isDragging = false;
          this.previousX = 0;
          this.previousY = 0;
          
          const el = this.el;

          window.addEventListener('mousedown', (e) => {
            this.isDragging = true;
            this.previousX = e.clientX;
            this.previousY = e.clientY;
          });
          window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
              this.isDragging = true;
              this.previousX = e.touches[0].clientX;
              this.previousY = e.touches[0].clientY;
            }
          });

          window.addEventListener('mouseup', () => { this.isDragging = false; });
          window.addEventListener('touchend', () => { this.isDragging = false; });

          window.addEventListener('mousemove', (e) => {
            if (!this.isDragging) return;
            const deltaX = e.clientX - this.previousX;
            const deltaY = e.clientY - this.previousY;
            this.previousX = e.clientX;
            this.previousY = e.clientY;
            
            let pos = el.getAttribute('position');
            pos.x += deltaX * 0.005;
            pos.y -= deltaY * 0.005;
            el.setAttribute('position', pos);
          });

          window.addEventListener('touchmove', (e) => {
            if (!this.isDragging || e.touches.length !== 1) return;
            const deltaX = e.touches[0].clientX - this.previousX;
            const deltaY = e.touches[0].clientY - this.previousY;
            this.previousX = e.touches[0].clientX;
            this.previousY = e.touches[0].clientY;
            
            let pos = el.getAttribute('position');
            pos.x += deltaX * 0.005;
            pos.y -= deltaY * 0.005;
            el.setAttribute('position', pos);
          });
        }
      });
    </script>
  </head>
  <body>

    <button id="ar-button" onclick="startAR()">點擊開始 AR 體驗</button>

    <!-- 畫面上的即時座標顯示框 -->
    <div id="info-panel">Position:<br>X: 0.50<br>Y: -1.50<br>Z: 0.00</div>

    <a-scene id="ar-scene" mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; filterMinCF: 0.0001; filterBeta: 0.001;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: true">
      
      <a-assets>
        <a-asset-item id="myModel" src="office_chair.glb"></a-asset-item>
        <video id="myVideo" src="NiuNiuVideo.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
        <audio id="myAudio" src="JoyRide.mp3" preload="auto"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 辨識圖 0：3D 模型 -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-entity id="chair-wrapper" position="0.5 -1.5 0" scale="0.05 0.05 0.05" touch-drag-move>
          <a-gltf-model src="#myModel" rotation="0 0 0"></a-gltf-model>
        </a-entity>
      </a-entity>

      <!-- 辨識圖 1：影片 -->
      <a-entity id="target-1" mindar-image-target="targetIndex: 1">
        <a-video src="#myVideo" position="0 0 0" width="1" height="0.56" rotation="0 0 0"></a-video>
      </a-entity>

      <!-- 辨識圖 2：聲音 -->
      <a-entity id="target-2" mindar-image-target="targetIndex: 2">
        <a-plane color="black" opacity="0.6" width="1" height="0.3">
          <a-text value="Playing Audio..." align="center" color="white" scale="0.5 0.5 0.5"></a-text>
        </a-plane>
      </a-entity>

    </a-scene>

    <script>
      let savedAudioTime = 0;

      function startAR() {
        document.getElementById('ar-button').style.display = 'none';
        
        const video = document.querySelector('#myVideo');
        const audio = document.querySelector('#myAudio');
        video.load();
        audio.load();

        const sceneEl = document.querySelector('#ar-scene');
        sceneEl.systems["mindar-image-system"].start();

        // 啟動即時座標更新迴圈
        startTrackingPosition();
      }

      function startTrackingPosition() {
        const chairWrapper = document.querySelector('#chair-wrapper');
        const infoPanel = document.querySelector('#info-panel');

        function update() {
          if (chairWrapper) {
            const pos = chairWrapper.getAttribute('position');
            // 確保抓得到屬性才更新
            if (pos) {
              infoPanel.innerHTML = `Position:<br>X: ${pos.x.toFixed(2)}<br>Y: ${pos.y.toFixed(2)}<br>Z: ${pos.z.toFixed(2)}`;
            }
          }
          requestAnimationFrame(update);
        }
        update();
      }

      document.addEventListener("DOMContentLoaded", function() {
        const target1 = document.querySelector('#target-1');
        const target2 = document.querySelector('#target-2');
        const video = document.querySelector('#myVideo');
        const audio = document.querySelector('#myAudio');

        // 影片事件
        target1.addEventListener("targetFound", () => {
          video.play().catch(err => console.log("影片播放失敗:", err));
        });
        target1.addEventListener("targetLost", () => {
          video.pause();
        });

        // 聲音事件（支援續播）
        target2.addEventListener("targetFound", () => {
          audio.currentTime = savedAudioTime;
          audio.play().catch(err => console.log("聲音播放失敗:", err));
        });
        target2.addEventListener("targetLost", () => {
          savedAudioTime = audio.currentTime;
          audio.pause();
        });
      });
    </script>
  </body>
</html>
