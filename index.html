<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      #ar-button {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        background: #007aff;
        color: white;
        padding: 14px 28px;
        border: none;
        border-radius: 25px;
        font-size: 18px;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      }
    </style>
  </head>
  <body>

    <button id="ar-button" onclick="startAR()">點擊開始 AR 體驗</button>

    <!-- 注意看這裡：移除了 autoStart: false，改由按鈕直接呼叫 -->
    <a-scene id="ar-scene" mindar-image="imageTargetSrc: targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: true">
      
      <a-assets>
        <a-asset-item id="myModel" src="ｏffice_ｃhair.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model src="#myModel" position="0 0 0" scale="0.5 0.5 0.5"></a-gltf-model>
      </a-entity>

    </a-scene>

    <script>
      function startAR() {
        document.getElementById('ar-button').style.display = 'none';
        console.log("使用者點擊了按鈕，準備啟動...");
      }
    </script>
  </body>
</html>
