<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      /* 製作一個漂亮的開始按鈕，破解 iOS 自動播放限制 */
      #ar-button {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        background: #007aff;
        color: white;
        padding: 12px 24px;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>

    <!-- 點擊後隱藏按鈕並啟動體驗（對 iPhone 非常重要） -->
    <button id="ar-button" onclick="startAR()">點擊開始 AR 體驗</button>

    <a-scene id="ar-scene" mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: true">
      
      <a-assets>
        <!-- 請確保模型是 .glb 格式 -->
        <a-asset-item id="myModel" src="office_chair.glb"></a-asset-item>
        <video id="myVideo" src="NiuNiuVideo.mp4" loop crossorigin="anonymous" playsinline></video>
        <audio id="myAudio" src="JoyRide.mp3" preload="auto"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 辨識圖 0：3D 模型 -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model src="#myModel" position="0 0 0" scale="0.5 0.5 0.5"></a-gltf-model>
      </a-entity>

      <!-- 辨識圖 1：影片 -->
      <a-entity mindar-image-target="targetIndex: 1" 
                on="targetFound: document.querySelector('#myVideo').play();" 
                off="targetLost: document.querySelector('#myVideo').pause();">
        <a-video src="#myVideo" position="0 0 0" width="1" height="0.56" rotation="0 0 0"></a-video>
      </a-entity>

      <!-- 辨識圖 2：聲音 -->
      <a-entity mindar-image-target="targetIndex: 2"
                on="targetFound: document.querySelector('#myAudio').play();"
                on-lost="targetLost: document.querySelector('#myAudio').pause();">
        <a-plane color="black" opacity="0.6" width="1" height="0.3">
          <a-text value="Playing Audio..." align="center" color="white" scale="0.5 0.5 0.5"></a-text>
        </a-plane>
      </a-entity>

    </a-scene>

    <script>
      // 點擊按鈕後才啟動 MindAR 相機，完美繞過 iPhone 限制
      function startAR() {
        document.getElementById('ar-button').style.display = 'none';
        const sceneEl = document.querySelector('#ar-scene');
        sceneEl.systems["mindar-image-system"].start();
      }
    </script>
  </body>
</html>
